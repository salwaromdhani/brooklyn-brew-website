<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <script
      src="https://kit.fontawesome.com/431f1e7af2.js"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <title>Café BROOKLYN BREW| Contact</title>
  </head>
  <body>
    <header class="header">
      <nav>
        <h1>
          <a href="index.html">BROOKLYN BREW</a>
        </h1>
        <ul>
          <li><a href="index.html">Accueil</a></li>
          <li><a href="where.html">Où nous trouver</a></li>
          <li class="active"><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <section class="contact">
      <div class="contact-form-container">
        <form action="#">
          <h1 class="underline">Une question ? Contactez-nous</h1>

          <label class="my-20" for="name">Nom :</label>
          <input type="text" id="name" name="name" required />

          <label class="my-20" for="email">Email :</label>
          <input type="email" id="email" name="email" required />

          <label class="my-20" for="message">Questions et remarques :</label>
          <textarea id="message" name="message" rows="5" required></textarea>

          <button class="btn btn-dark my-20" type="submit">SOUMETTRE</button>
        </form>
      </div>
    </section>

    <footer>
      <p>Copyright&copy; -2027 Café BROOKLYN BREW. Tous droits réservés.</p>
    </footer>
  </body>
</html>
